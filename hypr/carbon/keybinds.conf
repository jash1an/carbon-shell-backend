###############################################################################
# CARBON SHELL — DEDICATED HYPRLAND KEYBINDINGS
# Location: ~/.config/hypr/carbon/keybinds.conf
#
# You can freely edit this file! Any changes here are applied whenever you:
# 1. Press SUPER + SHIFT + R (or run 'hyprctl reload')
# 2. Use the Carbon Config Editor GUI (SUPER + C or QuickSettings gear icon)
###############################################################################

$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus

# ==============================================================================
# APPLICATIONS & WINDOW CONTROL
# ==============================================================================
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, [float; size 800 550] $terminal
bind = $mainMod, Q, killactive,
bind = ALT, F4, killactive,
bind = CTRL ALT, Delete, exec, hyprctl dispatch exit 0
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, togglefloating,
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod SHIFT, S, exec, hyprshot -m region
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/KillActiveProcess.sh

# ==============================================================================
# CARBON SHELL FEATURES & CONTROLS
# ==============================================================================
# Carbon Config Editor GUI (Settings)
bind = $mainMod, C, exec, ~/.config/hypr/scripts/carbon-config-editor
bind = $mainMod, comma, exec, ~/.config/hypr/scripts/carbon-config-editor
bind = $mainMod, B, exec, sh ~/.config/hypr/scripts/carbon-ipc.sh controls

# Carbon Spotlight Search
bind = $mainMod, R, exec, sh ~/.config/hypr/scripts/carbon-ipc.sh spotlight

# Carbon Overview (Atom-Fluid bohr model & workspace switcher)
bind = SUPER, Tab, exec, sh ~/.config/hypr/scripts/carbon-ipc.sh toggle-overview

# Carbon Wallpaper Picker
bind = $mainMod, N, exec, sh ~/.config/hypr/scripts/carbon-ipc.sh wallpaper

# Carbon Pomodoro Timer
bind = $mainMod, T, exec, ~/.config/hypr/scripts/carbon-pomodoro

# Lock Screen (Hyprlock with Carbon ornament)
bind = $mainMod, L, exec, ~/.config/hypr/scripts/hyprlock.sh

# Clipboard Manager (Cliphist + Rofi)
bind = $mainMod, V, exec, bash -c 'cliphist list | rofi -dmenu | cliphist decode | wl-copy'

# ==============================================================================
# NAVIGATION & WINDOW MOVEMENT
# ==============================================================================
# Move focus (Arrow keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows (WASD)
bind = $mainMod, A, movewindow, l
bind = $mainMod, D, movewindow, r
bind = $mainMod, W, movewindow, u
bind = $mainMod, S, movewindow, d

# Move windows (SUPER + CTRL + Arrow keys)
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

# Resize active window (SUPER + SHIFT + Arrow keys)
binde = $mainMod SHIFT, left, resizeactive, -50 0
binde = $mainMod SHIFT, right, resizeactive, 50 0
binde = $mainMod SHIFT, up, resizeactive, 0 -50
binde = $mainMod SHIFT, down, resizeactive, 0 50

# ==============================================================================
# WORKSPACES
# ==============================================================================
# Switch to workspace 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll workspaces with mouse wheel
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move / resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ==============================================================================
# HARDWARE & MEDIA KEYS
# ==============================================================================
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh --inc
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh --dec
bindel = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume.sh --toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioPrev, exec, playerctl previous
