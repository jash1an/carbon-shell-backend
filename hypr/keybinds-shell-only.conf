# ==============================================================================
# Carbon Shell — Minimal Shell Triggers
# Loaded when 'Keep your own keybindings' is selected.
# Only shell-specific actions are mapped; all window, workspace, navigation,
# and system shortcuts from your existing configuration are preserved.
# ==============================================================================

$mainMod = SUPER

# Carbon Settings Editor (GTK4 / Libadwaita)
bind = $mainMod, C, exec, ~/.config/carbon/scripts/carbon-config-editor

# Carbon Overview (Task View / Workspace Carousel)
bind = SUPER, Tab, exec, sh ~/.config/carbon/scripts/carbon-ipc.sh toggle-overview

# Carbon Spotlight / App Launcher
bind = $mainMod, Space, exec, sh ~/.config/carbon/scripts/carbon-ipc.sh spotlight

# Carbon Wallpaper Picker
bind = $mainMod, N, exec, sh ~/.config/carbon/scripts/carbon-ipc.sh wallpaper

# Carbon Pomodoro Timer
bind = $mainMod, T, exec, ~/.config/carbon/scripts/carbon-pomodoro

# Carbon Lock Screen
bind = $mainMod, L, exec, ~/.config/carbon/scripts/hyprlock.sh
