# ==============================================================================
# Carbon Shell — Hyprland Environment Integration
# Automatically loaded by ~/.config/hypr/hyprland.conf
# ==============================================================================

# Isolated Config Environment
env = CARBON_CONFIG_DIR,$HOME/.config/carbon

# Include user-local binaries (kitty, yazi, wl-copy, cliphist, ...)
env = PATH, $HOME/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl

# Dynamic Material You Theme Colors
source = ~/.config/carbon/colors.conf

# Look & Feel (window borders, gaps, decorations, blur, shadows)
source = ~/.config/carbon/looknfeel.conf

# Window & Layer Rules (Blur for QuickSettings, Overview, Island)
source = ~/.config/carbon/windowrules.conf

# Window & Workspace Animations (curves, windowsIn/Out/Move, fade, workspaces)
source = ~/.config/carbon/UserAnimations.conf

# Blur & Opacity App Exceptions (Media players, browsers, games, etc.)
source = ~/.config/carbon/blur-exceptions.conf

# Keybindings:
# Managed live from Carbon Settings App (Super + C) or by editing this line:
# - Full Carbon keybindings: source = ~/.config/carbon/keybinds.conf
# - Keep your own keybindings: source = ~/.config/carbon/keybinds-shell-only.conf
source = ~/.config/carbon/keybinds.conf

# Autostart Carbon Quickshell Service
exec-once = systemctl --user start carbon-quickshell.service

# Clipboard history daemon (Cliphist)
exec-once = bash -c 'wl-paste --watch cliphist store'
exec-once = bash -c 'wl-paste --type image --watch cliphist store'

# Vanish-mode dedicated shortcuts (nucleus mode)
source = ~/.config/carbon/vanish-keybinds.conf

# Power, button & lid actions
source = ~/.config/carbon/power.conf

# Idle daemon (screen dim, display timeout, suspend)
exec-once = hypridle -c ~/.config/carbon/hypridle.conf

# ==============================================================================
# Cursor
# no_warps = keep the pointer where it is when window focus changes via the
# keyboard (Alt+Tab, SUPER+arrow, ...). Without this, Hyprland warps the
# pointer to the centre of the newly focused window, which looks like the
# cursor "jumping" to a random spot when you Alt+Tab.
# ==============================================================================
cursor {
    no_warps = true
}

# ==============================================================================
# Audio + Screen Sharing startup
# Brings up PipeWire / WirePlumber and xdg-desktop-portal(-hyprland) so that
# screencast (Discord/OBS/browser) and the portal work, then re-asserts the
# ALSA hardware unmute + default sink. Order matters: portal.sh first (it
# (re)starts the audio/portal services), then the audio init.
# ==============================================================================
exec-once = ~/.config/carbon/scripts/portal.sh
exec-once = ~/.config/carbon/scripts/carbon-audio-init.sh

# ==============================================================================
# Snap-to-top = cover the screen (NOT fullscreen)
# Dragging a floating window up so it hits the top edge makes it snap to cover
# the screen it is on. `general:snap` gives floating windows edge-snapping while
# being dragged; carbon-snap-top.sh resizes the floating window to its monitor's
# native size and does NOT put it into fullscreen.
# ==============================================================================
general {
    snap {
        enabled = true
    }
}

exec-once = ~/.config/carbon/scripts/carbon-snap-top.sh


