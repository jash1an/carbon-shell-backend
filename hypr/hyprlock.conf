# ==============================================================================
# Ly TUI Theme for Hyprlock (Compact Translucent Edition)
# Configuration file: ~/.config/hypr/hyprlock.conf
# ==============================================================================

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = true
    immediate_render = true
}

# ── 1. Background Wallpaper with Frosted Glass Blur ───────────────────────────
background {
    monitor =
    path = ~/.config/hypr/current_wallpaper
    color = rgb(15, 15, 20)

    blur_passes = 2
    blur_size = 6
    noise = 0.015
    contrast = 0.95
    brightness = 0.70
    vibrancy = 0.20
}

# ── 2. Compact Translucent Ly Box ─────────────────────────────────────────────
shape {
    monitor =
    size = 370, 200
    color = rgba(15, 15, 22, 0.55)
    rounding = 6
    border_size = 2
    border_color = rgba(255, 255, 255, 0.35)
    position = 0, 0
    halign = center
    valign = center
}

# ── Header: Hostname & Session ───────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] echo "<b>$(hostname) (tty1)</b>"
    color = rgb(255, 255, 255)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 62
    halign = center
    valign = center
}

# ── Divider Line ─────────────────────────────────────────────────────────────
label {
    monitor =
    text = ─────────────────────────────────
    color = rgba(255, 255, 255, 0.25)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 44
    halign = center
    valign = center
}

# ── Login Prompt ─────────────────────────────────────────────────────────────
label {
    monitor =
    text = login:    <span foreground="##ffffff"><b>$USER</b></span>
    color = rgba(220, 220, 220, 0.95)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -45, 10
    halign = center
    valign = center
}

# ── Password Label ───────────────────────────────────────────────────────────
label {
    monitor =
    text = password:
    color = rgba(220, 220, 220, 0.95)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -95, -22
    halign = center
    valign = center
}

# ── Translucent Password Input Field ─────────────────────────────────────────
input-field {
    monitor =
    size = 145, 28
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = false
    dots_rounding = -1

    rounding = 4
    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(255, 255, 255, 0.10)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <span font_family="JetBrainsMono Nerd Font" foreground="##888888">password</span>
    hide_input = false

    position = 35, -22
    halign = center
    valign = center
}

# ── Footer: Function Keys & Ly Brand ─────────────────────────────────────────
label {
    monitor =
    text = F1: shutdown   F2: restart       ly
    color = rgba(255, 255, 255, 0.40)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = 0, -70
    halign = center
    valign = center
}

# ── Status Clock (Top Right) ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%a %d %b  %H:%M:%S')"
    color = rgba(255, 255, 255, 0.8)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -25, -25
    halign = right
    valign = top
}
