env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
source = colors.conf

monitor = , preferred, auto, 1

$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun

exec-once = nm-applet
exec-once = blueman-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/lib/hyprpolkitagent
exec-once = hypridle

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

source = ~/.config/hypr/configs/tags.conf
source = ~/.config/hypr/configs/looknfeel.conf
source = ~/.config/hypr/configs/UserAnimations.conf
source = ~/.config/hypr/configs/windowrules.conf
source = ~/.config/hypr/configs/input.conf
source = ~/.config/hypr/configs/keybinds-common.conf
source = ~/.config/hypr/configs/current-mode-keybinds.conf

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user start xdg-desktop-portal-hyprland xdg-desktop-portal

### PLUGINS ###
exec-once = hyprctl plugin load /home/shogun/.config/hypr/plugins/Hyprspace.so

plugin {
    overview {
        # Layout & Mechanics
        centerAligned = true
        hideEmptyWorkspace = true
        showNewWorkspace = false
        exitOnClick = true
        
        # Spacing to achieve the floating aesthetic
        gapsIn = 20
        gapsOut = 60
        
        # Border Styling (Carbon Theme)
        workspaceActiveBorder = rgb(8ee8a8)
        workspaceInactiveBorder = rgba(255, 255, 255, 0.15)
        workspaceBorderSize = 2
    }
}

# The smooth bezier curve for the zoom-out effect
animation = workspaces, 1, 5, default

# Toggle Fluid Workspace Overview
$mainMod = SUPER
bind = $mainMod, grave, overview:toggle # SUPER + ` (Tilde key)
