env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
source = colors.conf

monitor = , preferred, auto, 1

$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun

exec-once = nm-applet
exec-once = blueman-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/lib/hyprpolkitagent
exec-once = hypridle

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

source = ~/.config/hypr/configs/tags.conf
source = ~/.config/hypr/configs/looknfeel.conf
source = ~/.config/hypr/configs/UserAnimations.conf
source = ~/.config/hypr/configs/windowrules.conf
source = ~/.config/hypr/configs/input.conf
source = ~/.config/hypr/configs/keybinds-common.conf
source = ~/.config/hypr/configs/current-mode-keybinds.conf

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user start xdg-desktop-portal-hyprland xdg-desktop-portal

### PLUGINS ###
exec-once = hyprctl plugin load /home/shogun/.config/hypr/plugins/hyprexpo.so

plugin {
    hyprexpo {
        columns = 3
        gap_size = 10
        bg_col = rgb(050608)
        workspace_method = center current # The current workspace stays in the middle
        
        # Mechanical animation curve (fast, no heavy bouncing)
        animation = workspaces, 1, 3, default
        
        enable_gesture = true # Swipe up to open
        gesture_fingers = 3
        gesture_distance = 300
        gesture_positive = true
    }
}

# Workspace Overview Toggle
bind = $mainMod, grave, hyprexpo:expo, toggle
