#################################################################
# CARBON SHELL — NOTCH MODE KEYBINDINGS                        #
# Active when Bar Mode is set to Carbon Notch                   #
#################################################################

$mainMod = SUPER

# Mode Specific Shortcuts
bind = $mainMod, B, exec, ~/.config/hypr/scripts/carbon-ipc.sh center-dashboard
bind = $mainMod, R, exec, ~/.config/hypr/scripts/carbon-ipc.sh spotlight
bind = $mainMod, K, exec, ~/.config/hypr/scripts/carbon-ipc.sh spotlight
bind = $mainMod, C, exec, hyprpicker -a
bind = $mainMod SHIFT, B, exec, ~/.config/hypr/scripts/carbon-ipc.sh controls
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/carbon-ipc.sh power

# Window Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
