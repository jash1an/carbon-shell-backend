# ==============================================================================
# Carbon Shell — Hyprland Look & Feel Configuration
# Managed automatically by Carbon Settings App
# ==============================================================================

# Dynamic Material You Theme Colors
source = ~/.config/carbon/colors.conf

general {
    gaps_in = 6
    gaps_out = 6

    border_size = 1

    col.active_border = $outline
    col.inactive_border = $outline_variant

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 0.88
    inactive_opacity = 0.78

    shadow {
        enabled = false
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 2
        ignore_opacity = true
        new_optimizations = true
        special = false
        popups = true
        xray = true

        vibrancy = 0.1696
    }
}
