# ==============================================================================
# Carbon Shell — Power, Button & Lid Event Bindings
# Managed by Carbon Settings App (carbon-config-editor)
# ==============================================================================

# Physical Power & Sleep Buttons
bind = , XF86PowerOff, exec, ~/.config/carbon/scripts/carbon-power-handler.sh power_button
bind = , XF86Sleep, exec, ~/.config/carbon/scripts/carbon-power-handler.sh sleep_button

# Laptop Lid Switch Events (switch:on = closed, switch:off = opened)
bindl = , switch:on:Lid Switch, exec, ~/.config/carbon/scripts/carbon-power-handler.sh lid_close
bindl = , switch:off:Lid Switch, exec, ~/.config/carbon/scripts/carbon-power-handler.sh lid_open
