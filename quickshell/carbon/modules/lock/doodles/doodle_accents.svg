<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" width="350" height="80">
  <defs>
    <!-- Filter for subtle chalk / sketch texture -->
    <filter id="sketchy" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Sound vibration arcs next to left headphone -->
  <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 6 42 Q 2 48 6 56" />
    <path d="M 1 38 Q -4 48 1 60" stroke-width="1.8" opacity="0.6" />
  </g>

  <!-- Floating Sparkles / 4-Point Doodle Stars -->
  <!-- Star 1 above staff -->
  <path d="M 195 10 Q 195 16 189 16 Q 195 16 195 22 Q 195 16 201 16 Q 195 16 195 10 Z"
        fill="#FFFFFF" opacity="0.9" />
  <circle cx="206" cy="12" r="1.2" fill="#FFFFFF" opacity="0.75" />

  <!-- Star 2 near Spotify doodle -->
  <path d="M 282 14 Q 282 18 278 18 Q 282 18 282 22 Q 282 18 286 18 Q 282 18 282 14 Z"
        fill="#FFFFFF" opacity="0.8" />

  <!-- Floating Cute Sketched Heart -->
  <path d="M 168 28 C 168 22, 161 20, 158 24 C 155 20, 148 22, 148 28 C 148 35, 158 41, 158 41 C 158 41, 168 35, 168 28 Z"
        fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Tiny floating note dot -->
  <circle cx="140" cy="15" r="2.2" fill="#FFFFFF" opacity="0.8" />
  <path d="M 142 15 L 142 6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
</svg>